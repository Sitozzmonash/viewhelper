# viewhelper desktop runtime configuration.
#
# Copy to `desktop/config.yaml` (that file is gitignored) or edit in place.
# The mobile settings page can modify: prompts.conversation, prompts.screenshot,
# conversation.context_messages, asr.hotwords and asr.show_partial -- changes are
# persisted back to this file by the desktop app.

prompts:
  # Two completely independent prompts (PRD 8.2 / AC-14): conversation answers
  # must never use the screenshot prompt and vice versa.
  conversation: |
    你是我的实时面试助手。答案会显示在手机屏幕上，我只会扫一眼，不会逐字读。

    先判断【目标消息】（对方最近说的话）是不是需要我回答的面试问题：
    - 不是（闲聊、陈述、无关内容）：用 1-2 句大白话简短回应，不要硬套要点格式。
    - 是面试问题：直接输出要点式答案。

    要点式答案的要求：
    - 用编号列表（1. 2. 3.）逐条列出，让我一眼看出有几个点；
    - 通常 3-5 个点，简单问题 2-3 个；每个点 1-2 句话；
    - 通篇大白话、口语化，照着念也自然；专业术语可保留，但句子要短；
    - 每条里的关键词用 **加粗** 标出（手机端会渲染 Markdown，** 会正常加粗）；
    - 全文 250 字以内，一眼能扫完；
    - 不要开场白、不要总结段、不要客套话、不要说“作为一个 AI”。

    保持准确、切题；简历里没有的经历不要编造。

  screenshot: |
    你是一个截图分析助手。
    分析截图内容并直接回答最重要的问题。
    如果截图中包含题目，直接给答案并简要解释。

# resume_context: fixed personal background (resume) injected into BOTH the
# conversation and screenshot LLM requests. Put real content in the gitignored
# `config.yaml` only -- it is never sent to the mobile client or the cloud.
resume_context: ""

# resume: a short, toggleable instruction inserted into both system prompts
# telling the model to use the resume text already injected above it (the
# 【resume_context】 block). The model has no filesystem, so do NOT point it at a
# file name. The hint is only added when resume_context is non-empty. The hint
# TEXT is not secret, but keep it here (PC-side) rather than on the mobile client.
resume:
  hint_enabled: true
  hint_text: "在回答涉及我的经历、项目或能力的问题时，请结合上面【resume_context】中的简历内容来组织答案。"

# interview_notes: a local bulk notes file (e.g. your personal study notes)
# injected into BOTH the conversation and screenshot system prompts as an
# 【interview_notes】 block, right after the resume block. Set `path` to your own
# file: relative paths are resolved against the REPOSITORY ROOT (absolute paths
# are used as-is). The file is re-read on every request and is NEVER uploaded,
# sent to the mobile client or written to the logs -- only its length is logged.
# max_chars: 0 = inject the whole file; >0 = keep the first N characters and
# append an omission marker. hint_enabled toggles the 【interview_notes】
# reference line (it is only added when the block itself is non-empty).
interview_notes:
  enabled: true
  path: "docs/my-notes.md"
  max_chars: 0
  hint_enabled: true
  hint_text: "回答面试问题时，请优先参考上面【interview_notes】中的八股要点，并结合【resume_context】里的简历经历组织答案。"

conversation:
  # Number of previous FINAL messages sent as context together with the
  # explicitly marked target message (PRD 9). Range: 1..50.
  context_messages: 10
  # PC-side global hotkey that answers the LATEST turn (the keyboard equivalent
  # of tapping a bubble's ask dot on the phone). pynput GlobalHotKeys syntax.
  hotkey: "<ctrl>+<shift>+<enter>"
  hotkey_enabled: true
  hotkey_debounce_sec: 2.0
  # How many preceding messages the hotkey answer carries as context, counted
  # upward from the newest turn regardless of speaker ("last + recent N"). 0..50.
  hotkey_context_messages: 10

asr:
  # Set to false to run without any local ASR (transport/LLM still work).
  enabled: true
  # Hotwords handed to FunASR (space / comma / newline separated).
  hotwords: ""
  # Push asr_partial events to the mobile client while speaking.
  show_partial: true
  # Minimum interval between two asr_partial events for the same utterance.
  partial_interval_ms: 300
  # Hard cap for one utterance; the segment is finalized when exceeded.
  max_utterance_sec: 20.0
  # Audio kept before a VAD start point and prepended to the utterance.
  preroll_ms: 320
  models:
    vad: fsmn-vad
    streaming: paraformer-zh-streaming
    offline: paraformer-zh
    punctuation: ct-punc
    device: cpu
    # Skip ModelScope update checks (offline / air-gapped machines).
    disable_update: true
    # Trailing silence before an utterance is finalized (FunASR default: 800).
    # Lower = faster finals, higher risk of splitting at short pauses.
    max_end_silence_ms: 800
  # Fallback VAD used when funasr/torch are unavailable: plain RMS silence
  # detection so the pipeline can still produce finals.
  energy_vad:
    threshold_rms: 300.0
    min_speech_ms: 250
    end_silence_ms: 700

audio:
  # Everything is converted to 16 kHz mono int16 for FunASR.
  sample_rate: 16000
  # Block length read from the device before being handed to the ASR pipeline.
  block_ms: 100
  queue_size: 200
  # Device selection: null = OS default. Accepts a device name (substring match)
  # or an integer index. See `python -m src.main --list-audio-devices`.
  input_device: null
  loopback_device: null

screenshot:
  # pynput GlobalHotKeys syntax.
  hotkey: "<ctrl>+<shift>+<space>"
  # Ignore repeated triggers (key repeat / double tap) within this window.
  debounce_sec: 2.0
  # 0 = primary monitor.
  monitor_index: 0
  # Original PNG is stored locally under `dir`; it is never uploaded.
  dir: data/screenshots
  preview:
    max_width: 1280
    quality: 75
    format: jpeg
    target_bytes: 500000
  # Image actually sent to the vision model (kept in memory only).
  vision:
    max_width: 1568
    quality: 85

storage:
  database: data/viewhelper.sqlite3
  # Default limit used for history_sync_response.
  history_limit: 100

transport:
  # heartbeat every 5s; the relay marks the PC offline after 15s (PRD 20).
  heartbeat_interval_sec: 5.0
  reconnect:
    initial_sec: 1.0
    factor: 2.0
    max_sec: 30.0
    jitter_sec: 0.0
  # Outgoing messages queued while a send is in flight; dropped when full.
  send_queue_size: 256

logging:
  level: INFO
