[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viewhelper-relay"
version = "0.1.0"
description = "ViewHelper WebSocket relay: auth, presence, routing and Pub/Sub between the PC desktop app and the mobile web UI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
